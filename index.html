<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="index.js"></script>
  <link rel="icon" type="image/x-icon" href="./assets/video.svg">
  <script src="https://kit.fontawesome.com/af2b5c610b.js" crossorigin="anonymous"></script>
  <title>Scene Movie Search</title>
</head>
<body>
  <section id="navbar">
    <nav>
      <div class="row nav__row">
        <div class="nav__logo">
          <img src="./assets/video.svg" class="nav__logo--img">
          <div class="nav__logo--title">scene</div>
        </div>
        <div class="nav__links">
          <a href="#" class="nav__link link__hover-effect">Home</a>
          <a href="movies.html" class="nav__link link__hover-effect">Find a movie</a>
          <a href="#" class="nav__link">
            <button class="nav__link--contact no-cursor">CONTACT</button>
          </a>
        </div>
        <button class="btn__menu" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="menu__backdrop" style="visibility: hidden;">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fas fa-times"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
            </li>
            <li class="menu__list">
              <a href="movies.html" class="menu__link" onclick="closeMenu()">Find a movie</a>
            </li>
            <li class="menu__list">
              <a class="menu__link no-cursor" onclick="closeMenu()">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </section>
  <section id="landing-page">
    <div class="content-wrapper">      
      <h1>The BEST place to search for movies</h1>      
      <h2>Find the <span class="highlight">movie</span> you're looking for with 
        <span class="highlight">scene</span>          
      </h2>      
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Search by Keyword" onkeypress="clickPress(event)">
        <button class="search" onclick="sendData()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <img src="./assets/undraw_awards_faq6.svg" class="awards">
    </div>
  </section>
  <footer>
    <div class="container">
      <div class="row footer__row">
        <div class="footer__logo">
          <img src="./assets/video.svg" class="footer__logo--img">
          <h4 class="footer__logo--title">scene</h4>
        </div>
        <div class="footer__links">
          <a href="#" class="footer__link link__hover-effect">Home</a>
          <a href="movies.html" class="footer__link link__hover-effect">Find a movie</a>
          <a href="#" class="footer__link no-cursor">Contact</a>
        </div>
        <div class="footer__copyright">&copy 2026 scene inc</div>      
      </div>
    </div>
  </footer>
</body>
</html>
